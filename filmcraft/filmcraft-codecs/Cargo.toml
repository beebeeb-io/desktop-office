# Modified for the Beebeeb desktop app's media helper (filmcraft/PATCHES.md): the decoders of the formats that are
# patent-pool licensed, and APV and MXF, are optional features, all ON by default (the crate as published), so a
# build can leave them out entirely. symphonia's `aac` moved behind the `aac` feature.
[features]
default = [
    "h264",
    "hevc",
    "aac",
    "ac3",
    "eac3",
    "mpeg2",
    "prores",
    "dnx",
    "apv",
    "mxf",
    "dng",
]
dng = ["filmcraft-media/dng"]
h264 = ["dep:filmcraft-h264"]
hevc = ["dep:filmcraft-hevc"]
aac = [
    "dep:filmcraft-aac",
    "symphonia/aac",
]
ac3 = ["dep:filmcraft-ac3"]
eac3 = [
    "ac3",
    "filmcraft-ac3/eac3",
]
mpeg2 = ["dep:filmcraft-mpeg2v"]
prores = ["dep:filmcraft-prores"]
dnx = ["dep:filmcraft-dnx"]
apv = ["dep:filmcraft-apv"]
mxf = [
    "dep:filmcraft-mxf",
    "h264",
    "mpeg2",
    "dnx",
]

