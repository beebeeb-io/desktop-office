# The cargo-deny policy for beebeeb-io/desktop-office.
#
# Originally used to COUNT what is in the three upstream workspaces (audit/2026-11-12/).
# Now also used as a CI gate on the beebeeb-office crate, where bans must be 0.
[graph]
all-features = false

[advisories]
version = 2
yanked = "warn"
# zip 3.0.0 has 4 advisories about extracting archives TO DISK (symlinks, permission bits, abort
# on a symlink entry).  The three projects read archives in memory only — 270 uses of ZipArchive,
# 0 calls of an extract-to-disk function (README).  Not reachable as the code stands; the
# advisory stays until upstream moves to a fixed zip.
ignore = [
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    "RUSTSEC-2026-0429",
]

[licenses]
version = 2
confidence-threshold = 0.8
# Permissive only. MPL-2.0, LGPL and anything else is REPORTED, so a person decides.
allow = [
    "MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib",
    "Unicode-3.0", "Unicode-DFS-2016", "CC0-1.0", "BSL-1.0", "0BSD", "OFL-1.1", "Unlicense",
]

[licenses.private]
# Our own crate has no licence yet (the owner's call); ignore it in the check.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "allow"
# Network clients, TLS stacks, socket layers and async runtimes: none may be in the viewer's graph.
# List from the README and the viewer contract (deny.toml on main, §5.2).
deny = [
    { crate = "reqwest" }, { crate = "ureq" }, { crate = "hyper" }, { crate = "h2" }, { crate = "curl" },
    { crate = "isahc" }, { crate = "attohttpc" }, { crate = "tiny_http" }, { crate = "tungstenite" },
    { crate = "rustls" }, { crate = "native-tls" }, { crate = "openssl" }, { crate = "quinn" },
    { crate = "socket2" }, { crate = "mio" },
    { crate = "tokio" }, { crate = "async-std" }, { crate = "smol" }, { crate = "async-io" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The viewer spec (§3): sources are crates.io plus the git sources the spec accepted.
# craft-proof (hyphenation, through wordcraft-layout) is the only git dependency in the
# viewer closure.
allow-git = [
    "https://github.com/storytold/craft-libs",
]
