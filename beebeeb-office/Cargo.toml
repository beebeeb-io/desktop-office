[package]
name = "beebeeb-office"
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
publish = false
description = "The office viewer and editor crate for the Beebeeb desktop app"

[workspace]

[features]
# The editor (WordCraft and GridCraft engines). WordCraft is built WITHOUT its `font-store` feature
# (patches/wordcraft-engine-font-store-optional.patch), so no downloader and no TLS stack is linked.
default = ["edit"]
edit = ["dep:wordcraft-engine", "dep:gridcraft-engine"]
# DeckCraft's engine brings the MPL-2.0 `symphonia` crates. Off until Guus accepts MPL-2.0 (contract Q4);
# without it slides answer `Unsupported`. Nothing MPL is allowed in deny.toml.
edit-slides = ["edit", "dep:deckcraft-engine"]

[dependencies]
# WordCraft below wordcraft-engine (which reaches a network client): reader → layout → render.
wordcraft-docx   = { path = "../wordcraft/crates/docx" }
wordcraft-docbin = { path = "../wordcraft/crates/docbin" }
wordcraft-doc    = { path = "../wordcraft/crates/doc" }
wordcraft-layout = { path = "../wordcraft/crates/layout" }
wordcraft-render = { path = "../wordcraft/crates/render" }
wordcraft-fonts  = { path = "../wordcraft/crates/fonts" }

# GridCraft: the xlsx reader gives us the Workbook with sheets.
gridcraft-xlsx  = { path = "../gridcraft/crates/xlsx" }
gridcraft-model = { path = "../gridcraft/crates/model" }
gridcraft-numfmt = { path = "../gridcraft/crates/numfmt" }
gridcraft-calc  = { path = "../gridcraft/crates/calc" }
gridcraft-chart = { path = "../gridcraft/crates/chart" }
# The value, address and formula types the cells and their formulas are made of (both already in
# the closure, under the reader and the model).
gridcraft-core    = { path = "../gridcraft/crates/core" }
gridcraft-formula = { path = "../gridcraft/crates/formula" }

# DeckCraft: the pptx reader gives us the Presentation with slides.
deckcraft-pptx  = { path = "../deckcraft/crates/pptx" }
deckcraft-model = { path = "../deckcraft/crates/model" }
deckcraft-render = { path = "../deckcraft/crates/render" }

# The pre-scan reads a package's central directory with the same zip crate the three readers use,
# so it sees the entries they would see. Same version and features as theirs (zip 3.0.0 is already
# in the closure): no new crate.
zip = { version = "3.0.0", default-features = false, features = ["deflate"] }

# The editors. WordCraft without default features (no font-store: ureq/rustls stay out); GridCraft as is.
wordcraft-engine = { path = "../wordcraft/crates/engine", default-features = false, optional = true }
gridcraft-engine = { path = "../gridcraft/crates/engine", optional = true }
# Behind `edit-slides` only (MPL-2.0 via symphonia).
deckcraft-engine = { path = "../deckcraft/crates/engine", optional = true }
